<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Things to Recall</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --blue-dark: #2c5aa0;
            --blue-mid: #4a7ba7;
            --blue-light: #7ba3c0;
            --blue-pale: #c5d9e8;
            --line-color: #d4e3f2;
            --text: #1a1a1a;
            --white: #faf8f3;
            --undo-bg: #fff3cd;
        }

        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #f0f6fb 0%, #e8f0f7 100%);
            color: var(--text);
        }

        body {
            padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px) 0;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 500px;
            width: 100%;
            height: 100vh;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            background: 
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 39px,
                    var(--line-color) 39px,
                    var(--line-color) 40px
                ),
                linear-gradient(180deg, rgba(197, 217, 232, 0.3) 0%, rgba(255, 255, 255, 0.8) 100%),
                #faf8f3;
            background-attachment: fixed;
            box-shadow: inset 0 0 60px rgba(44, 90, 160, 0.08);
        }

        .header {
            padding: 24px 20px 16px;
            text-align: center;
            border-bottom: 2px solid var(--blue-pale);
            background: rgba(255, 248, 243, 0.7);
        }

        .header h1 {
            font-size: 28px;
            font-weight: 600;
            color: var(--blue-dark);
            letter-spacing: -0.5px;
        }

        .reminders-section {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 160px;
        }

        .reminder-item {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            margin-bottom: 16px;
            padding: 16px;
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid var(--blue-pale);
            border-radius: 8px;
            animation: slideIn 0.3s ease-out;
            transition: all 0.2s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .reminder-item.undo-state {
            background: var(--undo-bg);
            border-color: #ffc107;
            animation: pulse 0.5s ease;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .reminder-item.fade-out {
            animation: fadeOut 0.4s ease-out forwards;
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                transform: translateY(-20px);
            }
        }

        .checkbox-wrapper {
            margin-top: 4px;
            flex-shrink: 0;
        }

        .checkbox {
            width: 48px;
            height: 48px;
            cursor: pointer;
            appearance: none;
            border: 3px solid var(--blue-mid);
            border-radius: 6px;
            background: white;
            transition: all 0.2s ease;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .checkbox:hover {
            border-color: var(--blue-dark);
            background: var(--blue-pale);
            transform: scale(1.05);
        }

        .checkbox:checked {
            background: var(--blue-dark);
            border-color: var(--blue-dark);
        }

        .checkbox:checked::after {
            content: "✓";
            color: white;
            font-size: 28px;
            font-weight: bold;
        }

        .reminder-text {
            flex: 1;
            padding: 4px 0;
            font-size: 16px;
            line-height: 1.5;
            color: var(--text);
            word-break: break-word;
        }

        .reminder-item.undo-state .reminder-text {
            text-decoration: line-through;
            opacity: 0.6;
        }

        .undo-button {
            background: transparent;
            border: 2px solid #ffc107;
            color: #856404;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            flex-shrink: 0;
            margin-top: 4px;
        }

        .undo-button:hover {
            background: #ffc107;
            color: white;
            transform: scale(1.05);
        }

        .undo-countdown {
            font-size: 11px;
            color: #856404;
            margin-top: 4px;
            font-weight: 500;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--blue-light);
        }

        .empty-state p {
            font-size: 18px;
            line-height: 1.6;
        }

        .footer {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 500px;
            padding: 20px;
            padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
            background: linear-gradient(180deg, rgba(250, 248, 243, 0) 0%, rgba(250, 248, 243, 0.95) 50%, rgba(250, 248, 243, 1) 100%);
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: center;
        }

        .talk-button {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, var(--blue-dark), var(--blue-mid));
            color: white;
            font-size: 40px;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(44, 90, 160, 0.35);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            active: active;
        }

        .talk-button:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 32px rgba(44, 90, 160, 0.45);
        }

        .talk-button:active {
            transform: scale(0.98);
        }

        .talk-button.recording {
            animation: pulse-record 1s infinite;
            background: linear-gradient(135deg, #dc3545, #c82333);
        }

        @keyframes pulse-record {
            0%, 100% { 
                box-shadow: 0 8px 24px rgba(220, 53, 69, 0.35);
                transform: scale(1);
            }
            50% { 
                box-shadow: 0 8px 32px rgba(220, 53, 69, 0.6);
                transform: scale(1.02);
            }
        }

        .status {
            text-align: center;
            font-size: 14px;
            color: var(--blue-mid);
            min-width: 120px;
        }

        .status.error {
            color: #dc3545;
        }

        .status.success {
            color: #28a745;
        }

        .status.loading {
            animation: pulse 1s infinite;
        }

        /* Scrollbar styling */
        .reminders-section::-webkit-scrollbar {
            width: 6px;
        }

        .reminders-section::-webkit-scrollbar-track {
            background: transparent;
        }

        .reminders-section::-webkit-scrollbar-thumb {
            background: var(--blue-light);
            border-radius: 3px;
        }

        .reminders-section::-webkit-scrollbar-thumb:hover {
            background: var(--blue-mid);
        }

        @media (max-height: 600px) {
            .reminders-section {
                padding-bottom: 180px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Things to Recall</h1>
        </div>

        <div class="reminders-section" id="remindersContainer">
            <div class="empty-state">
                <p>Press the button to say what you need to remember.</p>
            </div>
        </div>

        <div class="footer">
            <div class="status" id="status"></div>
            <button class="talk-button" id="talkButton" title="Press and hold to record">
                🎤
            </button>
        </div>
    </div>

    <script>
        const API_URL = "http://localhost:5000";
        let isRecording = false;
        let recognition;

        const talkButton = document.getElementById("talkButton");
        const statusEl = document.getElementById("status");
        const remindersContainer = document.getElementById("remindersContainer");

        // Web Speech API setup
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            console.warn("Web Speech API not available");
        } else {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = "en-US";

            recognition.onstart = () => {
                isRecording = true;
                talkButton.classList.add("recording");
                showStatus("Listening...", "loading");
            };

            recognition.onend = () => {
                isRecording = false;
                talkButton.classList.remove("recording");
            };

            recognition.onerror = (event) => {
                console.error("Speech recognition error:", event.error);
                showStatus("Speech error: " + event.error, "error");
                isRecording = false;
                talkButton.classList.remove("recording");
            };

            recognition.onresult = async (event) => {
                let transcript = "";
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript;
                }

                if (transcript.trim()) {
                    await handleTranscription(transcript);
                } else {
                    showStatus("No speech detected", "error");
                }
            };
        }

        // Initialize
        async function init() {
            await checkHealth();
            await loadReminders();
        }

        async function checkHealth() {
            try {
                const res = await fetch(`${API_URL}/health`);
                const data = await res.json();
                console.log("Health check:", data);
                if (data.ollama && data.ollama !== "ok") {
                    showStatus("⚠️ Ollama not running (using fallback)", "error");
                }
            } catch (e) {
                showStatus("⚠️ Backend not running", "error");
            }
        }

        // Recording with Web Speech API
        talkButton.addEventListener("mousedown", startRecording);
        talkButton.addEventListener("touchstart", startRecording);
        document.addEventListener("mouseup", stopRecording);
        document.addEventListener("touchend", stopRecording);

        function startRecording(e) {
            e.preventDefault();
            if (!recognition) {
                showStatus("Speech recognition not supported", "error");
                return;
            }
            if (isRecording) return;
            
            try {
                recognition.start();
            } catch (e) {
                console.log("Recognition already started");
            }
        }

        function stopRecording(e) {
            if (!isRecording || !recognition) return;
            recognition.stop();
        }

        async function handleTranscription(transcript) {
            showStatus("Thinking...", "loading");

            try {
                // Send transcribed text to backend for reminder extraction
                const res = await fetch(`${API_URL}/api/transcribe`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        transcription: transcript
                    })
                });

                if (!res.ok) {
                    const error = await res.json();
                    showStatus("Could not process: " + (error.error || "Unknown error"), "error");
                    return;
                }

                const data = await res.json();
                console.log("Result:", data);
                
                showStatus("✓ Saved!", "success");
                setTimeout(() => showStatus(""), 2000);
                
                await loadReminders();
            } catch (e) {
                console.error("Error:", e);
                showStatus("Error: " + e.message, "error");
            }
        }

        async function loadReminders() {
            try {
                const res = await fetch(`${API_URL}/api/reminders`);
                const data = await res.json();
                renderReminders(data);
            } catch (e) {
                console.error("Error loading reminders:", e);
            }
        }

        function renderReminders(data) {
            const active = data.active || [];
            const undoQueue = data.undo_queue || [];
            
            if (active.length === 0 && undoQueue.length === 0) {
                remindersContainer.innerHTML = `
                    <div class="empty-state">
                        <p>Press the button to say what you need to remember.</p>
                    </div>
                `;
                return;
            }

            remindersContainer.innerHTML = "";

            // Active reminders
            active.forEach(reminder => {
                const el = createReminderElement(reminder, false);
                remindersContainer.appendChild(el);
            });

            // Undo queue
            undoQueue.forEach(reminder => {
                const timeLeft = new Date(reminder.expires_at) - new Date();
                const secondsLeft = Math.ceil(timeLeft / 1000);
                
                const el = createReminderElement(reminder, true, secondsLeft);
                remindersContainer.appendChild(el);

                // Auto-delete when timer expires
                if (timeLeft > 0) {
                    setTimeout(() => {
                        deleteReminder(reminder.id);
                    }, timeLeft + 100);
                }
            });
        }

        function createReminderElement(reminder, isUndo, secondsLeft) {
            const div = document.createElement("div");
            div.className = "reminder-item" + (isUndo ? " undo-state" : "");
            div.id = `reminder-${reminder.id}`;

            if (isUndo) {
                div.innerHTML = `
                    <div class="checkbox-wrapper">
                        <input type="checkbox" class="checkbox" checked disabled>
                    </div>
                    <div style="flex: 1;">
                        <div class="reminder-text">${escapeHtml(reminder.text)}</div>
                        <button class="undo-button" onclick="undoReminder(${reminder.id})">
                            ↶ Undo
                        </button>
                        <div class="undo-countdown">
                            Deletes in ${secondsLeft}s
                        </div>
                    </div>
                `;

                // Update countdown
                const countdown = setInterval(() => {
                    const countdownEl = div.querySelector(".undo-countdown");
                    if (countdownEl) {
                        secondsLeft--;
                        countdownEl.textContent = `Deletes in ${secondsLeft}s`;
                    } else {
                        clearInterval(countdown);
                    }
                }, 1000);
            } else {
                div.innerHTML = `
                    <div class="checkbox-wrapper">
                        <input type="checkbox" class="checkbox" id="check-${reminder.id}">
                    </div>
                    <div class="reminder-text">${escapeHtml(reminder.text)}</div>
                `;

                const checkbox = div.querySelector(".checkbox");
                checkbox.addEventListener("change", (e) => {
                    if (e.target.checked) {
                        completeReminder(reminder.id, div);
                    }
                });
            }

            return div;
        }

        async function completeReminder(id, element) {
            try {
                await fetch(`${API_URL}/api/complete/${id}`, { method: "POST" });
                element.classList.add("fade-out");
                
                setTimeout(() => {
                    loadReminders();
                }, 400);
            } catch (e) {
                console.error("Error completing reminder:", e);
            }
        }

        async function undoReminder(id) {
            try {
                await fetch(`${API_URL}/api/undo/${id}`, { method: "POST" });
                loadReminders();
            } catch (e) {
                console.error("Error undoing reminder:", e);
            }
        }

        async function deleteReminder(id) {
            try {
                await fetch(`${API_URL}/api/delete/${id}`, { method: "POST" });
                loadReminders();
            } catch (e) {
                console.error("Error deleting reminder:", e);
            }
        }

        function showStatus(message, type = "") {
            statusEl.textContent = message;
            statusEl.className = "status " + type;
        }

        function escapeHtml(text) {
            const div = document.createElement("div");
            div.textContent = text;
            return div.innerHTML;
        }

        // Load reminders periodically
        setInterval(loadReminders, 5000);

        // Start app
        init();
    </script>
</body>
</html>
